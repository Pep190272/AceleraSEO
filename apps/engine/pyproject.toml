[project]
name = "aceleraseo-engine"
version = "0.0.1"
description = "AceleraSEO — autonomous SEO strategy engine (Sense/Decide/Act/Learn)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-analytics-data>=0.18",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5,<0.17", "mypy>=1.10"]
# JS-rendering crawler for SPA / client-rendered sites (run `playwright install chromium`).
render = ["playwright>=1.44"]

[tool.ruff]
line-length = 100
target-version = "py312"

# The rule set is declared explicitly on purpose. Without `select`, ruff applies
# whatever its own defaults are for the installed version — and `dev` pinned only
# a floor (`ruff>=0.5`), so CI resolved to the newest release on every run.
#
# On 2026-08-24 that broke the build with no code change behind it: ruff 0.16
# widened its defaults to include BLE001 and DTZ011, and `ruff check src` went
# from clean to 8 errors overnight. Locally, ruff 0.15 still reported "All checks
# passed", so the failure was invisible outside CI.
#
# These four are the historical defaults, which is exactly what the code was
# written against. Widening the set is a deliberate decision to take, not
# something a dependency resolver should decide on our behalf.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "render: live browser tests (Playwright + network) — opt in with `-m render`",
]
# The `render` marker labelled those tests but nothing acted on it: a marker only
# tags a test, it does not deselect it. `pytest -q` therefore collected the live
# browser test and CI died on `ModuleNotFoundError: No module named 'playwright'`,
# even though the module is deliberately absent from `dev` and the test's own
# docstring promises "the default suite stays fast and offline".
#
# Deselecting here rather than in the workflow keeps the promise true locally too,
# and in one place. Opting in still works: a `-m` on the command line overrides
# this one, so `pytest -m render` runs exactly the live tests.
addopts = "-m 'not render'"
